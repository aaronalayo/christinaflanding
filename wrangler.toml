name = "christinaflanding"
compatibility_date = "2026-09-06"
pages_build_output_dir = "./dist"

# SPA client routes (/booking, /om-mig, …) serve index.html instead of a 404.
# Do not use public/_redirects `/* /index.html 200` — Cloudflare rejects that as a loop.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
